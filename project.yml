# Generate the Xcode project with:  xcodegen generate
name: Spindown
options:
  bundleIdPrefix: com.spindown
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  InRideKit:
    path: Packages/InRideKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Spindown:
    type: application
    platform: iOS
    sources:
      - path: Spindown
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    dependencies:
      - package: InRideKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SPINDOWN_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    info:
      path: Spindown/Resources/Info.plist
      properties:
        CFBundleDisplayName: Spindown
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        NSBluetoothAlwaysUsageDescription: Spindown connects to your Kinetic inRide sensor and heart-rate strap, and can share power and heart rate with your Garmin watch.
        UIBackgroundModes:
          - bluetooth-central
          - bluetooth-peripheral
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.spindown.app.upload
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        CFBundleURLTypes:
          - CFBundleURLName: com.spindown.app.oauth
            CFBundleURLSchemes:
              - spindown
        StravaClientID: $(STRAVA_CLIENT_ID)
        StravaClientSecret: $(STRAVA_CLIENT_SECRET)

schemes:
  Spindown:
    build:
      targets:
        Spindown: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: InRideKit/InRideKitTests
    archive:
      config: Release
